<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="header">
        <h1>Typing Speed Test</h1>
    </header>

    <main id="main">

        <h3>Example Text</h3>

        <section class="example-box">
            <button id="changeExample">Change Test Text</button>

            <div id="the-box">
                <textarea
                    id="testText"
                    class="testText2"
                    readonly
                >Text you have to write</textarea>
            </div>

            <button id="save_lock">Save & Lock Text</button>
        </section>

        <section id="typing-area">
            <textarea
                id="testArea"
                placeholder="Timer starts when you press any key"
            ></textarea>
        </section>

        <section id="timer">
            <div id="the-timer">
                <div class="timer">00:00:00</div>
                <button class="restart-button">Restart</button>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
